# MISI GEOMETRI — reverse proxy nginx
#
# Cara pakai:
#   sudo cp nginx.conf /etc/nginx/sites-available/gezymuse-quiz
#   (ganti server_name dengan domain, mis. kuis.gezytech.web.id)
#   sudo ln -s /etc/nginx/sites-available/gezymuse-quiz /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d kuis.gezytech.web.id

server {
    listen 80;
    server_name kuis.gezytech.web.id;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3021;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
}
